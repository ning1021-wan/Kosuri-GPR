name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "---- Installed package versions ----"
          python -c "import numpy, pandas, sklearn, scipy; print(f'numpy {numpy.__version__}, pandas {pandas.__version__}, sklearn {sklearn.__version__}, scipy {scipy.__version__}')"

      - name: Compile + import sanity check
        run: |
          # py_compile is more forgiving than compileall for fresh checkouts.
          set -e
          for f in $(find src tests -name "*.py" -type f); do
            python -m py_compile "$f" && echo "OK $f"
          done
          # Also make sure every src.* module imports cleanly (catches top-level bugs).
          PYTHONPATH=. python -c "import src.evaluation.nullsette, src.models.group_cv; print('imports OK')"

      - name: Unit tests
        run: |
          PYTHONPATH=. pytest tests/test_helpers.py -v --tb=short -p no:cacheprovider