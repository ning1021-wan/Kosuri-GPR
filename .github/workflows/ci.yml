name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show directory layout
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "--- src/ ---"
          ls -la src/
          echo "--- src/evaluation ---"
          ls -la src/evaluation/
          echo "--- tests/ ---"
          ls -la tests/

      - name: Compile every .py file
        run: |
          set -e
          for f in $(find src tests -name "*.py" -type f); do
            python -m py_compile "$f" || { echo "COMPILE FAIL: $f"; exit 1; }
          done
          echo "All files compile cleanly."

      - name: Verify src imports work
        run: |
          PYTHONPATH=. python -c "
          import src.evaluation.nullsette as ns
          import src.models.group_cv as gc
          print('nullsette:', ns.HEADER_RE.pattern[:30])
          print('group_cv:', gc.compute_metrics.__name__)
          "

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_helpers.py -v --tb=short -p no:cacheprovider --no-header